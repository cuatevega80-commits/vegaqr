<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escanear código QR V2</title>
<style>
  :root { --bg:#14171c; --fg:#f2f4f7; --muted:#9aa3b0; --accent:#e8b923; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  h1 { font-size: 22px; font-weight: 600; margin: 20px 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; font-size: 15px; text-align: center; }
  #reader {
    width: 100%; max-width: 420px; border-radius: 14px; overflow: hidden;
    border: 2px solid var(--accent); background: #000; min-height: 280px;
  }
  #reader video { width: 100% !important; object-fit: cover; }
  #status { margin-top: 16px; min-height: 22px; font-size: 15px; text-align: center; }
  #status.error { color: #ff8a80; }
  button {
    margin-top: 12px; padding: 14px 22px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #14171c; border: 0; border-radius: 12px;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  /* Resultado ampliado (zoom x2). Si cambias el factor de scale,
     ajusta: ancho = 100% / factor y alto = 320px / factor */
  #resultadoWrap {
    display: none;
    width: 100%; max-width: 420px; height: 320px;
    margin-top: 16px; overflow: hidden;
  }
  #resultadoFrame {
    width: 50%; height: 160px;
    transform: scale(2);
    transform-origin: top left;
    border: 0; background: #fff;
  }
</style>
</head>
<body>
  <h1>Escanear código QR</h1>
  <p>Apunta la cámara al código.</p>
  <div id="reader"></div>
  <div id="status" role="status"></div>
  <button id="retry" hidden>Reintentar cámara</button>

  <div id="resultadoWrap">
    <iframe id="resultadoFrame" title="Resultado"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script>
    let scanner;
    let done = false;
    const statusEl = document.getElementById("status");
    const retryBtn = document.getElementById("retry");
    const iframe = document.getElementById("resultadoFrame");
    const wrap = document.getElementById("resultadoWrap");

    function onScanSuccess(decodedText) {
      if (done) return;
      done = true;

      const token = decodedText.substring(0, 6);
      statusEl.className = "";
      statusEl.textContent = "Código leído: " + token;

      if (scanner) { scanner.stop().catch(function () {}); }

      // Mostrar contenedor del iframe
      wrap.style.display = "block";

      // Cargar página destino
      iframe.src = "https://xmonitorsecureloginapi.azurewebsites.net/api/Login/GetCode?token=" + encodeURIComponent(token);
    }

    function startScanner() {
      retryBtn.hidden = true;
      statusEl.className = "";
      statusEl.textContent = "Iniciando cámara…";
      done = false;
      wrap.style.display = "none";
      iframe.removeAttribute("src");

      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        function () {} // errores de lectura por fotograma: se ignoran
      ).then(function () {
        statusEl.textContent = "Buscando código…";
      }).catch(function () {
        statusEl.className = "error";
        statusEl.textContent = "No se pudo abrir la cámara. Permite el acceso en Safari y usa una página https.";
        retryBtn.hidden = false;
      });
    }

    retryBtn.addEventListener("click", startScanner);
    startScanner();
  </script>
</body>
</html>
